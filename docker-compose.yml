services:
  app:
    build: .
    image: gunpla-build:latest
    restart: unless-stopped
    ports:
      - '3334:3333'
    env_file:
      - .env.production
    environment:
      MIGRATE: 'true'
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    env_file:
      - .env.production
    command: tunnel --no-autoupdate run

volumes:
  mysql_data:
